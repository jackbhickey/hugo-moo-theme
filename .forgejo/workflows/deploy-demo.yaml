name: Deploy demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          HUGO_VERSION=$(curl -sL "https://api.github.com/repos/gohugoio/hugo/releases/latest" \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          wget -q -O /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      - name: Build exampleSite
        run: |
          hugo \
            --source exampleSite \
            --themesDir ../.. \
            --baseURL "https://hugo-moo-theme.moo.media/" \
            --destination ${{ github.workspace }}/public \
            --minify \
            --environment production

      - name: Install rsync + openssh
        run: apt-get update && apt-get install -y rsync openssh-client

      - name: Deploy to Hokuto
        # rrsync-jailed user on hokuto (moved from Kizuna 2026-08-20) —
        # the jail pins the destination, so the path is just "/".
        env:
          DEPLOY_KEY: ${{ secrets.HOKUTO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ${{ github.workspace }}/public/ \
            hugo-moo-theme-deploy@62.238.98.143:
