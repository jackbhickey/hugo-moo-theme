name: Deploy demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          HUGO_VERSION=$(curl -sL "https://api.github.com/repos/gohugoio/hugo/releases/latest" \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          wget -q -O /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      - name: Build exampleSite
        run: |
          hugo \
            --source exampleSite \
            --themesDir ../.. \
            --baseURL "https://hugo-moo-theme.moo.media/" \
            --destination ${{ github.workspace }}/public \
            --minify \
            --environment production

      - name: Install rsync + openssh
        run: apt-get update && apt-get install -y rsync openssh-client

      - name: Deploy to garage bucket
        # Replicated (rf=2) across the lab garage cluster; caddy serves the
        # bucket via garage's web endpoint. Scoped S3 key, no ssh.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_S3_SECRET_KEY }}
          AWS_REGION: garage
        run: |
          curl -sL https://github.com/peak/s5cmd/releases/download/v2.2.2/s5cmd_2.2.2_Linux-64bit.tar.gz | tar xz s5cmd
          ./s5cmd --endpoint-url http://100.116.214.17:3900 sync --delete "public/*" s3://hugo-moo-theme.moo.media/
